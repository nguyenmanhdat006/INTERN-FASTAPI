services:
  db:
    image: postgres:16-alpine
    container_name: fastapi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fastapi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastapi"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: fastapi-keycloak
    restart: unless-stopped
    command: ["start-dev", "--http-port=8080"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      APP_NAME: FastAPI Store API
      APP_VERSION: 1.0.0
      DEBUG: "true"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/fastapi
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: FastApi
      KEYCLOAK_CLIENT_ID: fastapi
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change-me}
    ports:
      - "8000:8000"

volumes:
  db_data:
  keycloak_data:
